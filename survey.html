<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Survey Results - Digital Twins for Energy Efficiency</title>
    <style>
        /* Base Reset and Typography */
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Century Gothic', sans-serif;
            background-color: #FFFFFF;
            display: flex;
            flex-direction: column;
        }

        /* Header Layout */
        header {
            background-color: #102C53;
            color: #FFFFFF;
            padding: 30px 20px;
            text-align: center;
            position: relative;
        }

        header h1 {
            margin: 0;
            font-size: 2.2em;
            font-weight: normal;
            padding: 0 50px;
        }

        header .subtitle {
            margin: 10px 0 0 0;
            font-size: 1.2em;
            font-weight: 300;
            opacity: 0.9;
        }

        /* Hamburger Menu Icon */
        .hamburger {
            position: absolute;
            top: 50%;
            right: 30px;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 100;
            padding: 5px;
        }

        .hamburger span {
            display: block;
            width: 30px;
            height: 3px;
            background-color: #FFFFFF;
            transition: 0.3s;
        }

        /* Dropdown Navigation */
        .dropdown-menu {
            position: absolute;
            top: 100%;
            right: 20px;
            background-color: #102C53;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            display: none;
            flex-direction: column;
            min-width: 220px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 99;
            text-align: left;
        }

        .dropdown-menu.show {
            display: flex;
        }

        .dropdown-menu a {
            color: #FFFFFF;
            text-decoration: none;
            padding: 15px 20px;
            font-size: 1.05em;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transition: background-color 0.2s ease;
        }

        .dropdown-menu a:last-child {
            border-bottom: none;
        }

        .dropdown-menu a:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Main Content - Survey Results Layout */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 20px;
        }

        .survey-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .intro-text {
            font-size: 1.25em;
            color: #333333;
            margin-bottom: 40px;
            text-align: center;
            font-weight: normal;
            border-bottom: 2px solid #102C53;
            padding-bottom: 15px;
        }

        /* Responsive Gallery Layout */
        .results-gallery {
            display: block;
            width: 100%;
        }

        .survey-chart {
            width: 100%;
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 45px auto;
            background-color: #FFFFFF;
            border: 1px solid #EFEFEF;
            box-shadow: 0 6px 18px rgba(16, 44, 83, 0.08);
            border-radius: 4px;
            transition: transform 0.2s ease;
        }

        .survey-chart:hover {
            transform: scale(1.01);
        }

        /* Sticky Footer */
        footer {
            background-color: #102C53;
            color: #FFFFFF;
            position: sticky;
            bottom: 0;
            width: 100%;
            z-index: 10;
            padding: 20px 0;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.2);
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Footer Column Structuring */
        .footer-left, .footer-right {
            flex: 1;
            display: flex;
        }

        .footer-left {
            justify-content: flex-start;
        }

        .footer-right {
            justify-content: flex-end;
        }

        .footer-center {
            flex: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .footer-center p {
            margin: 0;
            font-size: 1em;
            letter-spacing: 1px;
        }

        /* Logo Images Styling */
        .logo-placeholder {
            width: 160px;
            height: 55px;
            object-fit: contain;
            display: block;
        }

        /* Responsive Layout for Smaller Screens */
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }
            
            .intro-text {
                font-size: 1.1em;
                margin-bottom: 30px;
            }

            .survey-chart {
                margin-bottom: 30px;
            }

            /* Responsive Footer Rearrangement */
            .footer-content {
                flex-wrap: wrap;
                justify-content: space-evenly;
                gap: 20px;
            }
            .footer-center {
                order: 1;
                width: 100%;
                margin-bottom: 10px;
                flex: none;
            }
            .footer-left {
                order: 2;
                flex: initial;
            }
            .footer-right {
                order: 3;
                flex: initial;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1><strong>Survey Results: </strong>Digital Twins for Energy Efficiency on Dairy Farms</h1>
        <p class="subtitle">Improving sustainability in NI's food market</p>
        
        <button class="hamburger" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="dropdownMenu" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="dropdown-menu" id="dropdownMenu" role="menu">
            <a href="index.html" role="menuitem">demo</a>
            <a href="about.html" role="menuitem">about</a>
            <a href="architectural_diagram.html" role="menuitem">architectural diagram</a>
            <a href="survey.html" role="menuitem">farm survey results</a>
            <a href="poster.html" role="menuitem">digital poster</a>
        </nav>
    </header>

    <main>
        <div class="survey-container">
            <p class="intro-text">Here are some of the key results from the survey.</p>
            
            <div class="results-gallery">
                <img src="19renewables.png" alt="Survey results regarding renewables section 19" class="survey-chart">
                <img src="20renewables.png" alt="Survey results regarding renewables section 20" class="survey-chart">
                <img src="21renewables.png" alt="Survey results regarding renewables section 21" class="survey-chart">
                <img src="22renewables.png" alt="Survey results regarding renewables section 22" class="survey-chart">
                <img src="2herdsize.png" alt="Survey results detailing herd size data" class="survey-chart">
                <img src="3parlourtype.png" alt="Survey results detailing milking parlour types" class="survey-chart">
                <img src="7platecooler.png" alt="Survey results regarding plate cooler implementation" class="survey-chart">
                <img src="8heatrecovery.png" alt="Survey results detailing heat recovery systems" class="survey-chart">
                <img src="9waterheater.png" alt="Survey results regarding water heater infrastructure" class="survey-chart">
                <img src="10VSDvacuumpump.png" alt="Survey results highlighting VSD vacuum pump usage" class="survey-chart">
                <img src="11vsdmilkpump.png" alt="Survey results highlighting VSD milk pump usage" class="survey-chart">
                <img src="12powertype.png" alt="Survey results regarding farm power configuration types" class="survey-chart">
                <img src="15nighttariff.png" alt="Survey results documenting night tariff usage metrics" class="survey-chart">

    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-left">
                <img src="logo3.png" alt="Ulster University logo" class="logo-placeholder">
            </div>
            
            <div class="footer-center">
                <p>Festival of PhD Research 2026</p>
            </div>

            <div class="footer-right">
                <img src="logo2.svg" alt="AgriSearch logo" class="logo-placeholder">
            </div>
        </div>
    </footer>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('dropdownMenu');
            const hamburger = document.querySelector('.hamburger');
            
            // Toggle visibility class
            menu.classList.toggle('show');
            
            // Update ARIA state
            const isExpanded = menu.classList.contains('show');
            hamburger.setAttribute('aria-expanded', isExpanded);
        }

        // Close the dropdown if the user clicks anywhere outside of it
        window.onclick = function(event) {
            if (!event.target.closest('.hamburger') && !event.target.closest('.dropdown-menu')) {
                const dropdowns = document.getElementsByClassName("dropdown-menu");
                const hamburger = document.querySelector('.hamburger');
                
                for (let i = 0; i < dropdowns.length; i++) {
                    let openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                        hamburger.setAttribute('aria-expanded', 'false');
                    }
                }
            }
        }
    </script>
</body>
</html>
