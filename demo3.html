<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Twins for Energy Efficiency on Dairy Farms</title>
    <style>
        /* Base Reset and Typography */
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Century Gothic', sans-serif;
            background-color: #FFFFFF;
            display: flex;
            flex-direction: column;
        }

        /* Header Layout (Clean, Title Only) */
        header {
            background-color: #102C53;
            color: #FFFFFF;
            padding: 30px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 2.2em;
            font-weight: normal;
        }

        /* Main Content - Centered Horizontally & Vertically */
        main {
            flex: 1; /* Pushes footer to the bottom of the viewport */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* Responsive 16:9 Video Container */
        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 1024px;
            background-color: #000000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .video-wrapper::before {
            content: "";
            display: block;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Sticky Footer */
        footer {
            background-color: #102C53;
            color: #FFFFFF;
            position: sticky;
            bottom: 0;
            width: 100%;
            z-index: 10;
            padding: 20px 0;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.2);
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Footer Column Structuring */
        .footer-left, .footer-right {
            flex: 1;
            display: flex;
        }

        .footer-left {
            justify-content: flex-start;
        }

        .footer-right {
            justify-content: flex-end;
        }

        .footer-center {
            flex: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 12px;
        }

        .footer-center p {
            margin: 0;
            font-size: 1.2em;
            letter-spacing: 1px;
        }

        /* Footer Links */
        .footer-links {
            display: flex;
            gap: 30px;
        }

        .footer-links a {
            color: #FFFFFF;
            text-decoration: none;
            font-size: 1.05em;
            transition: opacity 0.2s ease;
        }

        .footer-links a:hover {
            opacity: 0.7;
            text-decoration: underline;
        }

        /* Logo Placeholders in White */
        .logo-placeholder {
            width: 160px;
            height: 55px;
            border: 2px dashed #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Responsive Layout for Smaller Screens */
        @media (max-width: 768px) {
            .footer-content {
                flex-direction: column;
                gap: 25px;
            }
            .footer-left, .footer-right {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Digital Twins for Energy Efficiency on Dairy Farms</h1>
    </header>

    <main>
        <div class="video-wrapper">
            <iframe src="https://player.vimeo.com/video/76979871?title=0&byline=0&portrait=0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-left">
                <div class="logo-placeholder">Logo 1</div>
            </div>
            
            <div class="footer-center">
                <p>Research Festival 2026</p>
                <div class="footer-links">
                    <a href="architectural_diagram.html">Architectural Diagram</a>
                    <a href="poster.html">Poster</a>
                </div>
            </div>

            <div class="footer-right">
                <div class="logo-placeholder">Logo 2</div>
            </div>
        </div>
    </footer>

</body>
</html>
